<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golden Lens | Cinematography</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #111827, #000);
    color:#f9fafb;
}
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* HERO */
.hero{
    min-height:85vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* LOGO */
.logo-img{
    width:160px;
    height:160px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 40px rgba(250,204,21,0.6);
    margin-bottom:20px;
}

/* TEXT */
h1{
    font-size:38px;
    margin:10px 0;
    letter-spacing:2px;
}
.tagline{
    color:#9ca3af;
    letter-spacing:2px;
    margin-bottom:30px;
}

/* BUTTONS */
.buttons a{
    display:inline-block;
    margin:10px;
    padding:14px 30px;
    border-radius:40px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}
.instagram{
    background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);
    color:white;
}
.whatsapp{
    background:#22c55e;
    color:black;
}
.buttons a:hover{
    transform:scale(1.08);
}

/* WORK SECTION */
.section{
    margin-top:60px;
}
.section h2{
    text-align:center;
    letter-spacing:3px;
    margin-bottom:30px;
}
.videos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:22px;
}
.video{
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.8);
}
.video iframe{
    width:100%;
    height:520px;
}

/* FOOTER */
.footer{
    text-align:center;
    margin:60px 0 20px;
    color:#9ca3af;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="hero">
        <!-- LOGO IMAGE -->
        <img src="logo.jpg" class="logo-img">

        <!-- NAME -->
        <h1>Golden Lens Cinema</h1>

        <!-- TAGLINE -->
        <div class="tagline">CINEMATOGRAPHY • REELS • FILMS</div>

        <!-- BUTTONS -->
        <div class="buttons">
            <a class="instagram" href="https://www.instagram.com/golden_lens__cinema">Instagram</a>
            <a class="whatsapp" href="https://wa.me/919322445880">WhatsApp</a>
        </div>
    </div>

    <!-- VIDEOS -->
    <div class="section">
        <h2>FEATURED WORK</h2>
        <div class="videos">

            <div class="video">
                <iframe src="https://www.youtube.com/embed/Rpj3zdD24DU" frameborder="0" allowfullscreen></iframe>
            </div>

            <div class="video">
                <iframe src="https://www.youtube.com/embed/JCPTaiD8zjA" frameborder="0" allowfullscreen></iframe>
            </div>

        </div>
    </div>

    <div class="footer">
        © 2026 Golden Lens Cinematography
    </div>

</div>

</body>
</html>
