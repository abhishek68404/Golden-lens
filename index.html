<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pritesh Pawar | Cinematographer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#020617;
    color:white;
}
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}
.header{
    text-align:center;
    margin-top:40px;
}
.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#1e293b;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 20px;
    font-size:32px;
    font-weight:bold;
}
.work{
    color:#94a3b8;
    margin-top:5px;
    letter-spacing:1px;
}
.buttons{
    text-align:center;
    margin:30px 0;
}
.buttons a{
    display:inline-block;
    margin:10px;
    padding:14px 22px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
}
.whatsapp{
    background:#22c55e;
    color:black;
}
.instagram{
    background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);
    color:white;
}
.section{
    margin-top:50px;
}
.section h2{
    text-align:center;
    margin-bottom:20px;
}
.videos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
}
.video{
    background:#020617;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.7);
}
.video iframe{
    width:100%;
    height:200px;
}
.footer{
    text-align:center;
    margin:40px 0 10px;
    font-size:14px;
    color:#94a3b8;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">PP</div>
        <h1>Pritesh Pawar</h1>
        <div class="work">CINEMATOGRAPHER</div>
    </div>

    <div class="buttons">
        <a class="whatsapp" href="https://wa.me/919322445880">WhatsApp</a>
        <a class="instagram" href="https://www.instagram.com/golden_lens__cinema">Instagram</a>
    </div>

    <div class="section">
        <h2>My Work</h2>
        <div class="videos">

            <!-- YouTube Short 1 -->
            <div class="video">
                <iframe src="https://www.youtube.com/embed/Rpj3zdD24DU" frameborder="0" allowfullscreen></iframe>
            </div>

            <!-- YouTube Short 2 -->
            <div class="video">
                <iframe src="https://www.youtube.com/embed/JCPTaiD8zjA" frameborder="0" allowfullscreen></iframe>
            </div>

        </div>
    </div>

    <div class="footer">
        © 2026 Pritesh Pawar
    </div>

</div>

</body>
</html>
