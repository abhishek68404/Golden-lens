<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golden Lens | Cinematography</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family: 'Poppins', Arial, sans-serif;
    background: radial-gradient(circle at top, #111827, #000);
    color:#f9fafb;
}
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}
.hero{
    min-height:80vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.logo{
    font-size:60px;
    font-weight:800;
    letter-spacing:4px;
    background:linear-gradient(90deg,#facc15,#f97316);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:glow 3s infinite alternate;
}
@keyframes glow{
    from{filter:drop-shadow(0 0 5px #facc15)}
    to{filter:drop-shadow(0 0 25px #f97316)}
}
.tagline{
    margin-top:10px;
    color:#9ca3af;
    letter-spacing:2px;
}
.buttons{
    margin-top:30px;
}
.buttons a{
    display:inline-block;
    margin:10px;
    padding:14px 28px;
    border-radius:40px;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}
.instagram{
    background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);
    color:white;
}
.youtube{
    background:#ef4444;
    color:white;
}
.buttons a:hover{
    transform:scale(1.08);
}
.section{
    margin-top:80px;
}
.section h2{
    text-align:center;
    margin-bottom:30px;
    letter-spacing:3px;
}
.videos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:22px;
}
.video{
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.8);
}
.video iframe{
    width:100%;
    height:520px;
}
.footer{
    text-align:center;
    margin:60px 0 20px;
    color:#9ca3af;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="hero">
        <div class="logo">GOLDEN LENS</div>
        <div class="tagline">CINEMATOGRAPHY • REELS • FILMS</div>

        <div class="buttons">
            <a class="instagram" href="https://www.instagram.com/golden_lens__cinema">Instagram</a>
            <a class="youtube" href="https://www.youtube.com/@goldenlenscinema">YouTube</a>
        </div>
    </div>

    <div class="section">
        <h2>FEATURED WORK</h2>
        <div class="videos">

            <div class="video">
                <iframe src="https://www.youtube.com/embed/Rpj3zdD24DU" frameborder="0" allowfullscreen></iframe>
            </div>

            <div class="video">
                <iframe src="https://www.youtube.com/embed/JCPTaiD8zjA
